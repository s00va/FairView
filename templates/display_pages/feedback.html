{% extends 'subpages/base.html' %}

{% block title %} Dashboard {% endblock %}

{% block header %} {% endblock %}

{% block body %}

{% include 'subpages/navbar_speaker.html' %}

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">

            <div class="mb-4">
                <h5 class="card-title fw-semibold mb-1 display-5">Feedback</h5>
                <p class="text-muted mb-0">Below is feedback on your talk.</p>
            </div>

            <div id="feedback_container" class="mb-3"></div>

            <div class="row g-4">

                <div class="col-12">
                    <h6 class="border-bottom pb-2 mb-0">Talk Details</h6>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Talk Title</label>
                    <input type="text" class="form-control" value="{{talkTitle}}" disabled>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Conference</label>
                    <input type="text" class="form-control" value="{{conference}}" disabled>
                </div>

                <div class="col-12">
                    <label class="form-label">Talk Description</label>
                    <textarea class="form-control" rows="5" disabled>{{talkDescription}}</textarea>
                </div>

                <div class="col-12">
                    <h6 class="border-bottom pb-2 mb-0 mt-2">Feedback</h6>
                </div>

                <div class="col-12">
                    <textarea class="form-control" rows="5" disabled>{{feedback1}}</textarea>
                </div>

                <div class="col-12">
                    <textarea class="form-control" rows="5" disabled>{{feedback2}}</textarea>
                </div>


            </div>

        </div>
    </div>
</div>

{% endblock %}
